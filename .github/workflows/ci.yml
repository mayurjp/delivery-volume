name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check pipeline
      - run: pytest
      # The Python test exports the shared range-maths vectors; the committed copy must be current so the
      # Vitest run in the site job checks the same numbers.
      - name: Shared vectors are up to date
        run: git diff --exit-code site/src/lib/vectors.json site/src/lib/periodVectors.json site/src/lib/trailVectors.json site/src/lib/footprintVectors.json

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /delivery-volume/
